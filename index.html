<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#1a472a"/>
<title>المعلم الذكي - تطبيق تعليمي</title>
<style>
:root{
--primary:#2d7a4a;--secondary:#1a472a;--accent:#4ade80;--bg:#0a1f1a;--card:#132e23;--text:#e8f5e9;--muted:#a1d5b8;--danger:#ef4444;--warn:#f59e0b;--shadow:0 10px 30px rgba(0,0,0,.4);--transition:all .2s cubic-bezier(.4,0,.2,1)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
body{display:flex;justify-content:center;align-items:stretch}
#app{width:100%;max-width:640px;height:100vh;display:flex;flex-direction:column;background:linear-gradient(135deg,var(--bg),var(--secondary))}
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:linear-gradient(135deg,var(--secondary),var(--primary));border-bottom:2px solid var(--accent);gap:10px}
.logo{width:40px;height:40px;background:linear-gradient(135deg,var(--accent),#22c55e);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:20px}
.header-title{flex:1}
.header-title h1{margin:0;font-size:18px;color:var(--accent);font-weight:700}
.header-title p{margin:2px 0 0;font-size:11px;color:var(--muted)}
.header-btn{padding:8px 12px;border:1px solid rgba(74,222,128,.3);background:rgba(74,222,128,.1);color:var(--accent);border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;transition:var(--transition)}
.header-btn:hover{background:rgba(74,222,128,.2);border-color:var(--accent)}
.quick-actions{display:flex;gap:6px;padding:10px 12px;background:rgba(45,122,74,.3);border-bottom:1px solid rgba(74,222,128,.2);overflow-x:auto}
.action-btn{padding:6px 12px;background:rgba(74,222,128,.15);color:var(--accent);border:1px solid rgba(74,222,128,.3);border-radius:6px;cursor:pointer;font-size:11px;font-weight:600;white-space:nowrap;transition:var(--transition)}
.action-btn:hover{background:var(--accent);color:var(--secondary)}
.status{padding:10px 14px;font-size:11px;background:rgba(10,31,26,.7);border-bottom:1px solid rgba(74,222,128,.2);display:flex;align-items:center;gap:6px;color:var(--muted);min-height:36px}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse .8s infinite}
.chat{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.msg{max-width:85%;padding:12px 14px;border-radius:14px;line-height:1.6;word-break:break-word;animation:slideIn .3s}
.msg.user{align-self:flex-start;background:linear-gradient(135deg,var(--primary),var(--secondary));border:1px solid rgba(74,222,128,.2)}
.msg.ai{align-self:flex-end;background:rgba(26,71,42,.5);border:1px solid rgba(74,222,128,.3)}
.msg.system{align-self:center;background:rgba(74,222,128,.1);color:var(--accent);font-size:12px;max-width:70%}
.msg-meta{font-size:9px;opacity:.6;margin-top:4px;color:var(--muted)}
.input-section{padding:12px;border-top:1px solid rgba(74,222,128,.2);background:rgba(10,31,26,.95);display:flex;gap:8px;align-items:flex-end}
.input-wrapper{flex:1;position:relative}
.input-wrapper input{width:100%;border:1px solid rgba(74,222,128,.3);background:rgba(26,71,42,.3);color:var(--text);border-radius:10px;padding:12px 12px;outline:none;font-size:15px;transition:var(--transition)}
.input-wrapper input:focus{border-color:var(--accent);background:rgba(26,71,42,.5);box-shadow:0 0 0 3px rgba(74,222,128,.1)}
.input-wrapper input::placeholder{color:var(--muted)}
.send-btn{background:linear-gradient(135deg,var(--accent),#22c55e);color:var(--secondary);border:none;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;transition:var(--transition)}
.send-btn:disabled{opacity:.5;cursor:not-allowed}
.send-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 4px 12px rgba(74,222,128,.3)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:20px;z-index:1000}
.modal.show{display:flex}
.modal-content{width:min(500px,95vw);background:linear-gradient(135deg,var(--secondary),var(--card));border:2px solid var(--accent);border-radius:16px;padding:20px;max-height:90vh;overflow-y:auto;animation:slideUp .3s}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;border-bottom:2px solid rgba(74,222,128,.2);padding-bottom:12px}
.modal-header h2{margin:0;font-size:18px;color:var(--accent)}
.modal-close{background:none;border:none;color:var(--accent);cursor:pointer;font-size:24px}
.form-group{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.form-label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase}
.form-input,.form-select{width:100%;border:1px solid rgba(74,222,128,.3);background:rgba(26,71,42,.3);color:var(--text);border-radius:8px;padding:10px 12px;outline:none;font-size:14px;transition:var(--transition)}
.form-input:focus,.form-select:focus{border-color:var(--accent);background:rgba(26,71,42,.5)}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.btn{border:none;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;transition:var(--transition);font-size:14px}
.btn-primary{background:var(--accent);color:var(--secondary)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(74,222,128,.3)}
.btn-secondary{background:rgba(74,222,128,.1);color:var(--accent);border:1px solid rgba(74,222,128,.3)}
.subject-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.subject-card{padding:12px;background:rgba(45,122,74,.2);border:1px solid rgba(74,222,128,.3);border-radius:10px;cursor:pointer;transition:var(--transition);text-align:center}
.subject-card:hover{background:rgba(74,222,128,.2);border-color:var(--accent)}
.subject-card.selected{background:var(--accent);color:var(--secondary)}
.level-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.level-btn{padding:12px;background:rgba(45,122,74,.2);border:1px solid rgba(74,222,128,.3);border-radius:10px;cursor:pointer;transition:var(--transition);color:var(--text);font-weight:600}
.level-btn:hover{background:rgba(74,222,128,.2)}
.level-btn.selected{background:var(--accent);color:var(--secondary)}
.tabs{display:flex;gap:8px;border-bottom:1px solid rgba(74,222,128,.2);padding-bottom:8px;margin-bottom:12px}
.tab{padding:8px 12px;border:none;background:none;color:var(--muted);cursor:pointer;font-size:12px;font-weight:600;border-bottom:2px solid transparent;transition:var(--transition)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.history-item{background:rgba(45,122,74,.2);border:1px solid rgba(74,222,128,.2);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:var(--transition)}
.history-item:hover{background:rgba(74,222,128,.15)}
.spinner{display:inline-block;width:6px;height:6px;background:var(--accent);border-radius:50%;animation:pulse .8s infinite;margin-right:6px}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%{transform:scale(1);opacity:1}50%{transform:scale(1.2);opacity:.6}100%{transform:scale(1);opacity:1}}
@media(max-width:480px){
.msg{max-width:90%}
.modal-content{width:95vw}
.subject-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div id="app">
<div class="header">
<div class="logo">📚</div>
<div class="header-title">
<h1>المعلم الذكي</h1>
<p>منصة تعليمية ذكية</p>
</div>
<button class="header-btn" id="settingsBtn">⚙️</button>
</div>

<div class="quick-actions" id="quickActions">
<button class="action-btn" data-action="explain">اشرح</button>
<button class="action-btn" data-action="summarize">لخص</button>
<button class="action-btn" data-action="test">اختبرني</button>
<button class="action-btn" data-action="examples">أمثلة</button>
<button class="action-btn" data-action="translate">ترجم</button>
</div>

<div class="status">
<span class="status-dot"></span>
<span id="statusText">جاهز</span>
</div>

<div id="chat" class="chat"></div>

<div class="input-section">
<div class="input-wrapper">
<input id="msgInput" type="text" placeholder="اسأل عن أي شيء..."/>
</div>
<button class="send-btn" id="sendBtn">إرسال</button>
</div>
</div>

<div id="modal" class="modal">
<div class="modal-content">
<div class="modal-header">
<h2 id="modalTitle">الإعدادات</h2>
<button class="modal-close" id="modalClose">&times;</button>
</div>

<div id="setupStep" style="display:none">
<h3 style="color:var(--accent)">خطوة 1: اختر المادة</h3>
<div class="subject-grid" id="subjectGrid">
<div class="subject-card" data-subject="رياضيات">📐 رياضيات</div>
<div class="subject-card" data-subject="فيزياء">⚛️ فيزياء</div>
<div class="subject-card" data-subject="كيمياء">🧪 كيمياء</div>
<div class="subject-card" data-subject="أحياء">🔬 أحياء</div>
<div class="subject-card" data-subject="لغة عربية">🔤 عربية</div>
<div class="subject-card" data-subject="إنجليزية">🇬🇧 English</div>
<div class="subject-card" data-subject="تاريخ">📜 تاريخ</div>
<div class="subject-card" data-subject="جغرافيا">🌍 جغرافيا</div>
<div class="subject-card" data-subject="برمجة">💻 برمجة</div>
</div>

<h3 style="color:var(--accent);margin-top:16px">خطوة 2: اختر المستوى</h3>
<div class="level-grid" id="levelGrid">
<button class="level-btn" data-level="ابتدائي">🎒 ابتدائي</button>
<button class="level-btn" data-level="متوسط">📖 متوسط</button>
<button class="level-btn" data-level="إعدادي">📚 إعدادي</button>
<button class="level-btn" data-level="جامعي">🎓 جامعي</button>
</div>
</div>

<div id="settingsStep" style="display:none">
<div class="form-group">
<label class="form-label">مفتاح Google Gemini API</label>
<input class="form-input" id="apiKeyInput" type="password" placeholder="أدخل المفتاح..."/>
<small style="color:var(--muted);font-size:11px">احصل على المفتاح من aistudio.google.com</small>
</div>

<div class="form-group">
<label class="form-label">اللغة</label>
<select class="form-select" id="langSelect">
<option value="ar">العربية</option>
<option value="en">English</option>
</select>
</div>

<div class="form-group">
<label class="form-label">
<input type="checkbox" id="autoSearchToggle" checked/> البحث التلقائي عند الحاجة
</label>
</div>
</div>

<div id="historyStep" style="display:none">
<h3 style="color:var(--accent)">السجل</h3>
<div id="historyContainer"></div>
</div>

<div class="form-actions">
<button class="btn btn-secondary" id="cancelBtn">إلغاء</button>
<button class="btn btn-primary" id="saveBtn">حفظ</button>
</div>
</div>
</div>

<script>
// =====================================================
// 🎓 تطبيق المعلم الذكي - نظام تعليمي متقدم
// =====================================================

const CONFIG={
SUBJECTS:['رياضيات','فيزياء','كيمياء','أحياء','لغة عربية','إنجليزية','تاريخ','جغرافيا','برمجة'],
LEVELS:['ابتدائي','متوسط','إعدادي','جامعي'],
MODELS:['gemini-3.8-flash','gemini-2.5-flash','gemini-2.0-flash','gemini-1.5-flash','gemini-1.5-pro','gemini-pro'],
VERSIONS:['v1','v1beta'],
API_URL:'https://generativelanguage.googleapis.com'
};

const i18n={
ar:{ready:'جاهز',thinking:'جاري التفكير...',explain:'اشرح لي هذا الموضوع',summarize:'لخص النقاط الرئيسية',test:'اختبرني فيما تعلمت',examples:'أعطني أمثلة عملية',translate:'ترجم للإنجليزية',search:'جاري البحث في الإنترنت...',error:'حدث خطأ'},
en:{ready:'Ready',thinking:'Thinking...',explain:'Explain this topic to me',summarize:'Summarize the main points',test:'Test me on what I learned',examples:'Give me practical examples',translate:'Translate to English',search:'Searching the internet...',error:'An error occurred'}
};

const state={
lang:'ar',
subject:'',
level:'',
messages:[],
waiting:false
};

const DOM={
app:document.getElementById('app'),
chat:document.getElementById('chat'),
msgInput:document.getElementById('msgInput'),
sendBtn:document.getElementById('sendBtn'),
statusText:document.getElementById('statusText'),
modal:document.getElementById('modal'),
settingsBtn:document.getElementById('settingsBtn'),
apiKeyInput:document.getElementById('apiKeyInput'),
langSelect:document.getElementById('langSelect'),
saveBtn:document.getElementById('saveBtn'),
cancelBtn:document.getElementById('cancelBtn'),
modalClose:document.getElementById('modalClose'),
setupStep:document.getElementById('setupStep'),
settingsStep:document.getElementById('settingsStep'),
historyStep:document.getElementById('historyStep'),
subjectGrid:document.getElementById('subjectGrid'),
levelGrid:document.getElementById('levelGrid'),
quickActions:document.getElementById('quickActions'),
historyContainer:document.getElementById('historyContainer')
};

function t(key){return(i18n[state.lang]&&i18n[state.lang][key])||i18n.ar[key]||''}
function setStatus(text){DOM.statusText.textContent=text}
function addMessage(text,type,meta=''){const node=document.createElement('div');node.className='msg '+type;const content=document.createElement('div');content.textContent=text;node.appendChild(content);if(meta){const metaEl=document.createElement('div');metaEl.className='msg-meta';metaEl.textContent=meta;node.appendChild(metaEl)}DOM.chat.appendChild(node);DOM.chat.scrollTop=DOM.chat.scrollHeight;return node}
function showModal(step){DOM.modal.classList.add('show');DOM.setupStep.style.display=step==='setup'?'block':'none';DOM.settingsStep.style.display=step==='settings'?'block':'none';DOM.historyStep.style.display=step==='history'?'block':'none'}
function hideModal(){DOM.modal.classList.remove('show')}
function saveSettings(){const key=DOM.apiKeyInput.value.trim();if(!key||key.length<10){alert('المفتاح غير صحيح');return}localStorage.setItem('gemini_key',key);localStorage.setItem('lang',DOM.langSelect.value);state.lang=DOM.langSelect.value;hideModal()}
function initSetup(){DOM.subjectGrid.querySelectorAll('.subject-card').forEach(card=>{card.addEventListener('click',()=>{DOM.subjectGrid.querySelectorAll('.subject-card').forEach(c=>c.classList.remove('selected'));card.classList.add('selected');state.subject=card.dataset.subject})});DOM.levelGrid.querySelectorAll('.level-btn').forEach(btn=>{btn.addEventListener('click',()=>{DOM.levelGrid.querySelectorAll('.level-btn').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');state.level=btn.dataset.level})})}
async function askGemini(prompt){const key=localStorage.getItem('gemini_key');if(!key)throw new Error('لم تقم بإدخال مفتاح API');const systemPrompt=`أنت معلم متخصص في ${state.subject}، المستوى التعليمي: ${state.level}. كن واضحاً وشاملاً وسهل الفهم. استخدم الأمثلة والرسوم التوضيحية إن أمكن.`;const fullPrompt=systemPrompt+'\n\nسؤال الطالب: '+prompt;for(const model of CONFIG.MODELS){for(const version of CONFIG.VERSIONS){const url=`${CONFIG.API_URL}/${version}/models/${model}:generateContent?key=${key}`;try{const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:fullPrompt}]}]})});const data=await res.json();if(data?.candidates?.[0]?.content?.parts?.[0]?.text){localStorage.setItem('working_model',model);localStorage.setItem('working_version',version);return data.candidates[0].content.parts[0].text.trim()}}catch(e){console.log('محاولة نموذج بديل...')}}}throw new Error(t('error'))}
async function sendMessage(){const text=DOM.msgInput.value.trim();if(!text||state.waiting)return;addMessage(text,'user',new Date().toLocaleTimeString('ar'));DOM.msgInput.value='';const waitingNode=addMessage(t('thinking'),'ai');state.waiting=true;DOM.sendBtn.disabled=true;setStatus(t('thinking'));try{const answer=await askGemini(text);waitingNode.textContent=answer;waitingNode.className='msg ai';state.messages.push({q:text,a:answer})}catch(e){waitingNode.textContent=e.message}finally{state.waiting=false;DOM.sendBtn.disabled=false;setStatus(t('ready'))}}
DOM.sendBtn.addEventListener('click',sendMessage);
DOM.msgInput.addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()});
DOM.settingsBtn.addEventListener('click',()=>showModal('settings'));
DOM.saveBtn.addEventListener('click',saveSettings);
DOM.cancelBtn.addEventListener('click',hideModal);
DOM.modalClose.addEventListener('click',hideModal);
DOM.quickActions.querySelectorAll('.action-btn').forEach(btn=>{btn.addEventListener('click',()=>{const action=btn.dataset.action;const prompts={explain:t('explain'),summarize:t('summarize'),test:t('test'),examples:t('examples'),translate:t('translate')};DOM.msgInput.value=prompts[action];DOM.msgInput.focus()})});

state.lang=localStorage.getItem('lang')||'ar';
document.documentElement.lang=state.lang;
initSetup();

if(!localStorage.getItem('gemini_key')){
showModal('setup');
}else{
DOM.setupStep.style.display='none';
}
</script>
</body>
</html>
